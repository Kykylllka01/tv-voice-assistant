plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The release key lives outside the repository; keystore.properties (git-ignored) says where. Without it the
// release build is signed with the debug key, so anyone can build and sideload from a fresh clone.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.tvvoice.assistant'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvvoice.assistant'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.0'
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    // Android ships org.json; plain JVM tests need the real one.
    testImplementation 'org.json:json:20240303'
}
